plugins {
    id 'com.android.application'
}

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'com.lucapiciollo.filetto'
    compileSdk 36

    defaultConfig {
        applicationId 'com.lucapiciollo.filetto'
        minSdk 23
        targetSdk 36
        versionCode 7
        versionName '1.0.6'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    signingConfigs {
        release {
            // Preferred: local keystore.properties (git-ignored, developer machine only).
            // Fallback: environment variables / GitHub Secrets (used in CI).
            def storeFilePath = keystoreProperties.getProperty('storeFile') ?: System.getenv('RELEASE_STORE_FILE')
            if (storeFilePath != null && !storeFilePath.isEmpty() && rootProject.file(storeFilePath).exists()) {
                storeFile rootProject.file(storeFilePath)
                storePassword keystoreProperties.getProperty('storePassword') ?: System.getenv('RELEASE_STORE_PASSWORD')
                keyAlias keystoreProperties.getProperty('keyAlias') ?: System.getenv('RELEASE_KEY_ALIAS')
                keyPassword keystoreProperties.getProperty('keyPassword') ?: System.getenv('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            // Debug build: no minification, fast iteration.
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Signing config is only applied when release keystore env vars point to an existing file
            // (see signingConfigs.release above). Without secrets configured, the release build
            // still succeeds but produces an unsigned APK/AAB, ready to be signed later.
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-nearby:19.3.0'
}
